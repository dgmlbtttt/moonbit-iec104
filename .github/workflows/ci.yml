name: Check and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Update dependencies
        run: |
          moon version --all
          moon update
      - name: Check all targets
        run: moon check --deny-warn --target all
      - name: Test portable target
        run: moon test --deny-warn --target wasm-gc

      - name: Test native target on Unix
        if: runner.os != 'Windows'
        run: moon test --deny-warn --target native
      - name: Format and interface checks
        run: |
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code
      - name: Run native demonstration
        if: runner.os != 'Windows'
        run: moon run --target native cmd/main
