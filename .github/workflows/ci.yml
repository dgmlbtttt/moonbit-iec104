name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MoonBit Toolchain
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          $binDir = Join-Path $HOME ".moon" "bin"
          if (-not (Test-Path $binDir)) {
            $binDir = Join-Path $env:USERPROFILE ".moon" "bin"
          }
          echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Code Formatting & Warnings
        shell: pwsh
        run: |
          $binDir = Join-Path $HOME ".moon" "bin"
          if (-not (Test-Path $binDir)) {
            $binDir = Join-Path $env:USERPROFILE ".moon" "bin"
          }
          $env:PATH = "$binDir;$env:PATH"
          moon version
          moon fmt --check
          moon check --deny-warn
          moon info

      - name: Execute Unit Test Suite
        shell: pwsh
        run: |
          $binDir = Join-Path $HOME ".moon" "bin"
          if (-not (Test-Path $binDir)) {
            $binDir = Join-Path $env:USERPROFILE ".moon" "bin"
          }
          $env:PATH = "$binDir;$env:PATH"
          moon test --deny-warn

      - name: Execute CLI Demonstration
        shell: pwsh
        run: |
          $binDir = Join-Path $HOME ".moon" "bin"
          if (-not (Test-Path $binDir)) {
            $binDir = Join-Path $env:USERPROFILE ".moon" "bin"
          }
          $env:PATH = "$binDir;$env:PATH"
          moon run cmd/main
