name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MoonBit Toolchain (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -sSfL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://cli.moonbitlang.com/install/bash.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Setup MoonBit Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Code Formatting & Warnings
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$USERPROFILE/.moon/bin:$PATH"
          moon version
          moon fmt --check
          moon check --deny-warn
          moon info

      - name: Execute Unit Test Suite
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$USERPROFILE/.moon/bin:$PATH"
          moon test --deny-warn

      - name: Execute CLI Demonstration
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$USERPROFILE/.moon/bin:$PATH"
          moon run cmd/main
